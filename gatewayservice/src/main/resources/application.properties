server.port=8080
spring.application.name=gatewayservice

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true

# ================= ROUTES =================

# AUTH
spring.cloud.gateway.routes[0].id=authservice
spring.cloud.gateway.routes[0].uri=lb://authservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# USERS
spring.cloud.gateway.routes[1].id=userservice
spring.cloud.gateway.routes[1].uri=lb://userservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

# IDEAS
spring.cloud.gateway.routes[2].id=ideaservice
spring.cloud.gateway.routes[2].uri=lb://idea-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ideas/**
spring.cloud.gateway.routes[2].predicates[1]=Path=/api/requests/**

# PROJECTS
spring.cloud.gateway.routes[3].id=projectservice
spring.cloud.gateway.routes[3].uri=lb://project-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/projects/**

# ROOMS
spring.cloud.gateway.routes[4].id=serviceroom
spring.cloud.gateway.routes[4].uri=lb://roomservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/rooms/**

# INTERNAL USERS (Feign)
spring.cloud.gateway.routes[5].id=userservice-internal
spring.cloud.gateway.routes[5].uri=lb://userservice
spring.cloud.gateway.routes[5].predicates[0]=Path=/internal/users/**

# CORS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

logging.level.org.springframework.cloud.gateway=DEBUG


# JWT
jwt.secret=CHANGE_THIS_SECRET_KEY_32_CHAR_MINIMUM_1234567890
