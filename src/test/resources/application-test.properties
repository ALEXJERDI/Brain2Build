# =====================================================
# \u2705 DATABASE CONFIGURATION (PostgreSQL local)
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/Brain2Build_test
spring.datasource.username=postgres
spring.datasource.password=n
spring.datasource.driver-class-name=org.postgresql.Driver
  
  # =====================================================
  # \u2705 JPA / HIBERNATE CONFIGURATION
  # =====================================================
  # Let Hibernate build tables automatically from @Entity classes
  # "create-drop" = create all tables at start, drop them when tests finish
spring.jpa.hibernate.ddl-auto=update
  
  # Show SQL statements for debugging (optional but helpful)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
  
  # Use the PostgreSQL dialect for better compatibility
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
  
  # Keep consistent naming (avoid weird underscores)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  
  # Prevent Spring Boot from auto-switching to H2 during tests
spring.test.database.replace=none
  
  # =====================================================
  # \u2705 LOGGING CONFIGURATION (Optional, but pro dev style)
  # =====================================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
  
  # =====================================================
  # \u2705 OTHER TEST SETTINGS
  # =====================================================
  # Disable Flyway/Liquibase if not using migrations
spring.flyway.enabled=false
spring.liquibase.enabled=false
  
  # Set timezone to UTC for consistent timestamp testing
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
