# ============================
# == SERVER CONFIG
# ============================
server.port=8080

# ============================
# == APPLICATION NAME
# ============================
spring.application.name=gatewayservice

# ============================
# == EUREKA CLIENT CONFIG
# ============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================
# == SPRING CLOUD GATEWAY - DISCOVERY (Eureka)
# ============================
spring.cloud.gateway.discovery.locator.enabled=true

# ============================
# == AUTH-SERVICE ROUTE
# ============================
spring.cloud.gateway.routes[0].id=authservice
spring.cloud.gateway.routes[0].uri=lb://authservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Cookie

# ============================
# == USER-SERVICE ROUTES
# ============================

# USERS ROUTE
spring.cloud.gateway.routes[1].id=users-route
spring.cloud.gateway.routes[1].uri=lb://userservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Cookie

# WORKERS ROUTE
spring.cloud.gateway.routes[2].id=workers-route
spring.cloud.gateway.routes[2].uri=lb://userservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/workers/**
spring.cloud.gateway.routes[2].filters[0]=RemoveRequestHeader=Cookie

# IDEATORS ROUTE
spring.cloud.gateway.routes[3].id=ideators-route
spring.cloud.gateway.routes[3].uri=lb://userservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/ideators/**
spring.cloud.gateway.routes[3].filters[0]=RemoveRequestHeader=Cookie


# Internal API (for Feign calls from authservice)
spring.cloud.gateway.routes[4].id=userservice-internal
spring.cloud.gateway.routes[4].uri=lb://userservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/internal/users/**
spring.cloud.gateway.routes[4].filters[0]=RemoveRequestHeader=Cookie


# ============================
# == CORS CONFIG
# ============================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# ============================
# == JWT SECRET
# ============================
jwt.secret=CHANGE_THIS_SECRET_KEY_32_CHAR_MINIMUM_1234567890

# ============================
# == TEMP BASIC SECURITY
# ============================
spring.security.user.name=admin
spring.security.user.password=123456
