
# ===============================
# Application Info
# ===============================
spring.application.name=Brain2Build
server.port=8081

# ===============================
# Datasource Config (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/Brain2Build
spring.datasource.username=postgres
spring.datasource.password=n

# Important: le driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
# Recommande : en developpement => update ou validate
# En production => none (Flyway gere le schema)

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte Hibernate pour PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway (DB migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Actuator (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===============================
# JWT CONFIGURATION
# ===============================
application.security.jwt.secret=MaSuperCleSecretePourJWT123456789
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000
